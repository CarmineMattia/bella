# Lab cutover G5 helper: dial a MeshInvite from a GitHub-hosted runner (distinct egress).
# Not production. Triggered by workflow_dispatch with base64 invite JSON.
name: mesh-g5-dial
on:
  workflow_dispatch:
    inputs:
      invite_b64:
        description: Base64 of mesh.invite.json from --mesh-g5-listen
        required: true
        type: string
      relay_only:
        description: Strip direct IPs (relay-only dial)
        required: false
        default: "true"
        type: string

jobs:
  dial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Egress IP
        id: egress
        run: |
          IP=$(curl -4 -fsS --max-time 10 https://ifconfig.me || curl -4 -fsS --max-time 10 https://api.ipify.org)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "runner_egress=$IP"
      - name: Fetch lab bella binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o bella \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/$(
              gh api "repos/${{ github.repository }}/releases/tags/g5-lab-bin" \
                --jq '.assets[] | select(.name=="bella") | .id'
            )"
          # Fallback: public download URL
          if [[ ! -s bella ]]; then
            curl -fsSL -o bella \
              "https://github.com/${{ github.repository }}/releases/download/g5-lab-bin/bella"
          fi
          chmod +x bella
          ./bella --help | head -5
      - name: Dial invite
        env:
          BELLA_MESH_RELAY: default
          INVITE_B64: ${{ inputs.invite_b64 }}
        run: |
          echo "$INVITE_B64" | base64 -d > mesh.invite.json
          RELAY_FLAG=()
          if [[ "${{ inputs.relay_only }}" == "true" ]]; then
            RELAY_FLAG=(--mesh-g5-relay-only)
          fi
          ./bella --mesh-g5-dial mesh.invite.json "${RELAY_FLAG[@]}" | tee dial.json
      - name: Upload dial result
        uses: actions/upload-artifact@v4
        with:
          name: mesh-g5-dial-result
          path: |
            dial.json
